name: OMEGA FI ENGINE

on:
  # Run automatically every 15 minutes Mon–Fri
  schedule:
    - cron: "*/15 3-10 * * 1-5"
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run OMEGA-FI engine
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python app.py
